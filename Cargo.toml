[package]
name = "surrealdb_local_wrapper"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
surrealdb = { version = "3.2.4", features = ["kv-mem", "kv-surrealkv"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "tracing"] }
uniffi = { version = "0.32.1", features = ["bindgen", "build", "cli", "ffi-trace", "tokio"] }

[build-dependencies]
uniffi = { version = "0.32.1", features = ["build"] }

[dev-dependencies]
uniffi = { version = "0.32.1", features = ["bindgen-tests"] }


[lib]
crate-type = ["lib","cdylib","staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"